<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563EB">
    <title>Raqamli Daftar — Maktab hayoti bitta daftarda</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* Colors */
            --bg-page: #fbf9f4;
            --dot-color: #d8d0c2;
            --border-color: #1a1a1a;
            --border-width: 3px;
            --border-radius: 14px;
            --border-radius-sm: 8px;
            --card-bg: #ffffff;
            --card-shadow: 4px 4px 0 var(--border-color);
            --card-shadow-hover: 6px 6px 0 var(--border-color);
            --card-shadow-active: 1px 1px 0 var(--border-color);
            --text-main: #18181b;
            --text-muted: #52525b;
            --ruled-line: #e6dfd3;
            --input-bg: #faf7f2;
            --modal-overlay: rgba(0, 0, 0, 0.65);

            /* Theme accents */
            --primary: #2563EB;
            --primary-light: #dbeafe;
            --accent-yellow: #F59E0B;
            --accent-yellow-light: #fef3c7;
            --accent-red: #EF4444;
            --accent-red-light: #fee2e2;
            --accent-green: #10B981;
            --accent-green-light: #d1fae5;
            --accent-cyan: #06B6D4;
            --accent-cyan-light: #cffafe;

            /* Grades */
            --grade-5: #10B981;
            --grade-4: #06B6D4;
            --grade-3: #F59E0B;
            --grade-2: #EF4444;

            /* Fonts */
            --font-hand: 'Caveat', cursive, sans-serif;
            --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --header-h: 70px;
            --bottom-nav-h: 68px;
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-page: #121826;
                --dot-color: #243048;
                --border-color: #3b4252;
                --card-bg: #1a2234;
                --card-shadow: 4px 4px 0 #080d1a;
                --card-shadow-hover: 6px 6px 0 #080d1a;
                --card-shadow-active: 1px 1px 0 #080d1a;
                --text-main: #f3f4f6;
                --text-muted: #9ca3af;
                --ruled-line: #263248;
                --input-bg: #141c2c;
                --modal-overlay: rgba(0, 0, 0, 0.85);

                --primary-light: #1e3a8a;
                --accent-yellow-light: #78350f;
                --accent-red-light: #7f1d1d;
                --accent-green-light: #064e3b;
                --accent-cyan-light: #164e63;
            }
        }

        [data-theme="dark"] {
            --bg-page: #121826;
            --dot-color: #243048;
            --border-color: #3b4252;
            --card-bg: #1a2234;
            --card-shadow: 4px 4px 0 #080d1a;
            --card-shadow-hover: 6px 6px 0 #080d1a;
            --card-shadow-active: 1px 1px 0 #080d1a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --ruled-line: #263248;
            --input-bg: #141c2c;
            --modal-overlay: rgba(0, 0, 0, 0.85);

            --primary-light: #1e3a8a;
            --accent-yellow-light: #78350f;
            --accent-red-light: #7f1d1d;
            --accent-green-light: #064e3b;
            --accent-cyan-light: #164e63;
        }

        [data-theme="light"] {
            --bg-page: #fbf9f4;
            --dot-color: #d8d0c2;
            --border-color: #1a1a1a;
            --card-bg: #ffffff;
            --card-shadow: 4px 4px 0 var(--border-color);
            --card-shadow-hover: 6px 6px 0 var(--border-color);
            --card-shadow-active: 1px 1px 0 var(--border-color);
            --text-main: #18181b;
            --text-muted: #52525b;
            --ruled-line: #e6dfd3;
            --input-bg: #faf7f2;
            --modal-overlay: rgba(0, 0, 0, 0.65);

            --primary-light: #dbeafe;
            --accent-yellow-light: #fef3c7;
            --accent-red-light: #fee2e2;
            --accent-green-light: #d1fae5;
            --accent-cyan-light: #cffafe;
        }

        /* Base Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-page);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 22px 22px;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 30px;
            -webkit-font-smoothing: antialiased;
        }

        @media (max-width: 768px) {
            body {
                padding-bottom: calc(var(--bottom-nav-h) + 20px + env(safe-area-inset-bottom));
            }
        }

        /* Accessibility: reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Typography & Handwritten Elements */
        h1, h2, h3, .handwritten {
            font-family: var(--font-hand);
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .marker-underline {
            display: inline-block;
            position: relative;
            background: linear-gradient(180deg, transparent 65%, rgba(245, 158, 11, 0.35) 65%);
            padding: 0 4px;
            border-radius: 4px;
        }

        /* Containers & Cards */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .notebook-card {
            background-color: var(--card-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 24px;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        /* Buttons & Interactions */
        .btn {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 20px;
            border-radius: var(--border-radius-sm);
            border: var(--border-width) solid var(--border-color);
            background-color: #fff;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--border-color);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            user-select: none;
        }

        .btn:hover:not(:disabled) {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--border-color);
        }

        .btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--border-color);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        .btn-yellow {
            background-color: var(--accent-yellow);
            color: #1a1a1a;
        }
        .btn-yellow:hover:not(:disabled) {
            background-color: #d97706;
            color: #fff;
        }

        .btn-red {
            background-color: var(--accent-red);
            color: #ffffff;
        }
        .btn-red:hover:not(:disabled) {
            background-color: #dc2626;
        }

        .btn-green {
            background-color: var(--accent-green);
            color: #ffffff;
        }
        .btn-green:hover:not(:disabled) {
            background-color: #059669;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0 var(--border-color);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius-sm);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1rem;
            box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.05);
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--card-bg);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Header Bar */
        .app-header {
            background-color: var(--card-bg);
            border-bottom: var(--border-width) solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
            padding: 10px 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon {
            font-size: 1.8rem;
            filter: drop-shadow(2px 2px 0 var(--border-color));
        }

        .logo-title {
            font-size: 1.7rem;
            line-height: 1;
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Navigations: Desktop */
        .desktop-nav {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            border-bottom: 2px dashed var(--ruled-line);
            padding-bottom: 12px;
            overflow-x: auto;
        }

        .nav-tab-btn {
            background: var(--card-bg);
            border: var(--border-width) solid var(--border-color);
            padding: 10px 18px;
            border-radius: var(--border-radius-sm);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--border-color);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .nav-tab-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--border-color);
        }

        .nav-tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--border-color);
        }

        /* Mobile Bottom Tab Bar */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: var(--border-width) solid var(--border-color);
            z-index: 999;
            padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.08);
            justify-content: space-around;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 8px;
            background: none;
            border: none;
            cursor: pointer;
            gap: 2px;
            transition: all 0.15s ease;
        }

        .mobile-nav-item .emoji {
            font-size: 1.4rem;
        }

        .mobile-nav-item.active {
            color: var(--primary);
            background-color: var(--primary-light);
            border: 2px solid var(--border-color);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .desktop-nav {
                display: none;
            }
            .mobile-bottom-nav {
                display: flex;
            }
        }

        /* Ruled Table Layouts */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            background-color: var(--card-bg);
            -webkit-overflow-scrolling: touch;
        }

        .notebook-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            text-align: left;
        }

        .notebook-table th, .notebook-table td {
            padding: 12px 14px;
            border-bottom: 2px dashed var(--ruled-line);
            border-right: 1px dashed var(--ruled-line);
        }

        .notebook-table th:last-child, .notebook-table td:last-child {
            border-right: none;
        }

        .notebook-table th {
            background-color: var(--input-bg);
            font-weight: 800;
            color: var(--text-main);
            border-bottom: var(--border-width) solid var(--border-color);
            white-space: nowrap;
        }

        .notebook-table tr:last-child td {
            border-bottom: none;
        }

        /* Grade Circles */
        .grade-circle {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            border: 2.5px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffffff;
            box-shadow: 2px 2px 0 var(--border-color);
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.15s ease;
            user-select: none;
        }

        .grade-circle:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .grade-circle:active {
            transform: scale(0.95);
        }

        .grade-5 { background-color: var(--grade-5); }
        .grade-4 { background-color: var(--grade-4); }
        .grade-3 { background-color: var(--grade-3); color: #1a1a1a; }
        .grade-2 { background-color: var(--grade-2); }

        .grade-badge-sm {
            width: 28px;
            height: 28px;
            min-width: 28px;
            font-size: 0.9rem;
            border-width: 2px;
            box-shadow: 1px 1px 0 var(--border-color);
        }

        /* Subject Badges */
        .subject-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 800;
            border: 2px solid var(--border-color);
            box-shadow: 2px 2px 0 var(--border-color);
            white-space: nowrap;
        }

        /* Stat Cards */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card.blue { background-color: var(--primary-light); color: var(--text-main); }
        .stat-card.orange { background-color: var(--accent-yellow-light); color: var(--text-main); }
        .stat-card.green { background-color: var(--accent-green-light); color: var(--text-main); }

        .stat-info .stat-label {
            font-size: 0.95rem;
            font-weight: 800;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .stat-info .stat-value {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .stat-icon {
            font-size: 2.8rem;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.15));
        }

        /* Split Login Layout */
        .login-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            align-items: center;
            min-height: calc(100vh - 120px);
            padding: 20px 0;
        }

        @media (max-width: 900px) {
            .login-layout {
                grid-template-columns: 1fr;
                gap: 24px;
                min-height: auto;
            }
        }

        .hero-banner {
            padding: 20px 0;
        }

        .hero-title {
            font-size: 3.2rem;
            line-height: 1.15;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .hero-features {
            list-style: none;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hero-feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .hero-feature-item .icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: #fff;
            box-shadow: 2px 2px 0 var(--border-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .auth-card-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--ruled-line);
            padding-bottom: 12px;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 10px;
            font-weight: 800;
            border: var(--border-width) solid var(--border-color);
            background-color: var(--input-bg);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--border-color);
            transition: all 0.15s ease;
            color: var(--text-main);
        }

        .auth-tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--border-color);
        }

        /* Schedule Grid for Teacher */
        .schedule-grid-table th {
            text-align: center;
            min-width: 140px;
        }

        .schedule-cell-input {
            width: 100%;
            border: 1.5px dashed transparent;
            background: transparent;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .schedule-cell-input:hover {
            border-color: var(--dot-color);
            background-color: var(--input-bg);
        }

        .schedule-cell-input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .schedule-cell-input.saving {
            border-color: var(--accent-yellow);
            background-color: var(--accent-yellow-light);
        }

        .schedule-cell-input.saved {
            border-color: var(--accent-green);
        }

        /* Highlight current day column */
        .today-col {
            background-color: rgba(37, 99, 235, 0.08) !important;
            border-left: 2px solid var(--primary) !important;
            border-right: 2px solid var(--primary) !important;
        }

        /* Task Cards */
        .task-card {
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            background-color: var(--card-bg);
            padding: 16px 20px;
            margin-bottom: 14px;
            transition: transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .task-card.deadline-urgent {
            background-color: var(--accent-yellow-light);
            border-color: var(--accent-yellow);
        }

        .task-card.deadline-overdue {
            background-color: var(--accent-red-light);
            border-color: var(--accent-red);
        }

        .task-card.completed {
            opacity: 0.65;
            background-color: var(--input-bg);
        }

        .task-card.completed .task-text {
            text-decoration: line-through;
        }

        .task-checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            flex: 1;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2.5px solid var(--border-color);
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            box-shadow: 2px 2px 0 var(--border-color);
            font-size: 1rem;
            color: var(--primary);
            font-weight: 900;
            flex-shrink: 0;
            transition: all 0.1s ease;
        }

        .task-checkbox-wrap:hover .custom-checkbox {
            transform: scale(1.05);
        }

        /* Image Gallery */
        .image-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .image-card {
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            background-color: var(--card-bg);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .image-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--card-shadow-hover);
        }

        .image-card-thumb {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-bottom: 2px solid var(--border-color);
            background-color: #eee;
            display: block;
        }

        .image-card-body {
            padding: 10px;
            font-size: 0.85rem;

        </div>
    </div>

    <script>
        /**
         * Raqamli Daftar — Frontend Application
         * Pure Vanilla JS implementation with complete API contract integration
         */

        // ──────────────────────── SUPABASE AUTH CONFIG ────────────────────────
        const SUPABASE_KEY = 'sb_publishable_AJ9YQzNKEcDJGzaimxjn2g_IIOYPBne';
        let supabaseClient = null;
        if (window.supabase) {
            window.SUPABASE_ANON_KEY = SUPABASE_KEY;
        }

        // ──────────────────────── STATE ────────────────────────
        const state = {
            token: localStorage.getItem('daftar_token') || null,
            user: JSON.parse(localStorage.getItem('daftar_user') || 'null'),
            activeTab: 'jadval', // teacher: jadval | vazifalar | oquvchilar | baholar; student: bosh_sahifa | vazifalar | baholarim
            schedule: [],
            exam: { name: '', date: '' },
            tasks: [],
            students: [],
            grades: [],
            images: [],
            selectedStudentIdForGrade: null,
            theme: localStorage.getItem('daftar_theme') || 'auto'
        };

        // Telegram WebApp initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.expand();
                tg.ready();
                if (tg.colorScheme === 'dark' && state.theme === 'auto') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {
                console.warn('Telegram init note:', e);
            }
        }

        // Apply saved theme
        if (state.theme !== 'auto') {
            document.documentElement.setAttribute('data-theme', state.theme);
        }

        // ──────────────────────── API CLIENT ────────────────────────
        async function api(endpoint, options = {}) {
            const headers = options.headers || {};

            if (state.token) {
                headers['Authorization'] = `Bearer ${state.token}`;
            }

            if (!(options.body instanceof FormData) && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }

            try {
                const response = await fetch(endpoint, {
                    ...options,
                    headers
                });

                if (response.status === 401) {
                    // Token expired or invalid
                    logout(false);
                    showToast("Sessiya muddati tugadi. Iltimos qayta kiring.", "warning");
                    throw new Error("Avtorizatsiya muddati o'tgan");
                }

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Serverda xatolik yuz berdi");
                }
                return data;
            } catch (err) {
                console.error(`API Error [${endpoint}]:`, err);
                throw err;
            }
        }

        // ──────────────────────── TOAST & MODAL HELPERS ────────────────────────
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';

            toast.innerHTML = `<span>${icon}</span> <span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openModal(title, contentHtml) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = contentHtml;
            document.getElementById('appModalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('appModalOverlay').classList.remove('active');
        }

        function openLightbox(imageUrl, title = '', meta = '') {
            document.getElementById('lightboxImage').src = imageUrl;
            document.getElementById('lightboxTitle').textContent = title || 'Yuklangan rasm';
            document.getElementById('lightboxMeta').textContent = meta;
            document.getElementById('lightboxOverlay').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightboxOverlay').classList.remove('active');
            document.getElementById('lightboxImage').src = '';
        }

        // Close on backdrop click
        document.getElementById('appModalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.getElementById('lightboxOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });

        // ──────────────────────── UTILITIES ────────────────────────
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getSubjectColor(subject) {
            if (!subject) return { bg: '#e2e8f0', text: '#334155' };
            let hash = 0;
            for (let i = 0; i < subject.length; i++) {
                hash = subject.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hues = [215, 145, 38, 280, 335, 185, 20, 50, 195];
            const hue = hues[Math.abs(hash) % hues.length];
            return {
                bg: `hsl(${hue}, 80%, 90%)`,
                text: `hsl(${hue}, 95%, 22%)`
            };
        }

        const DAYS_UZ = [
            '', // 0-indexed dummy
            'Dushanba',
            'Seshanba',
            'Chorshanba',
            'Payshanba',
            'Juma',
            'Shanba'
        ];

        function getCurrentDaySlot() {
            const jsDay = new Date().getDay(); // 0 is Sunday, 1 is Monday ... 6 is Saturday
            return jsDay; // 1-6 map directly to our Dushanba-Shanba
        }

        function formatDateUz(dateString) {
            if (!dateString) return '—';
            try {
                const [year, month, day] = dateString.split('-');
                return `${day}.${month}.${year}`;
            } catch (e) {
                return dateString;
            }
        }

        // ──────────────────────── AUTHENTICATION FLOW ────────────────────────
        async function checkAppInit() {
            try {
                const setupRes = await api('/api/auth/check-setup');
                if (!setupRes.has_teacher) {
                    renderSetupModal();
                    return;
                }

                // If user is logged in
                if (state.token && state.user) {
                    initDashboard();
                } else {
                    renderLoginPage();
                }
            } catch (err) {
                showToast("Server bilan ulanishda xatolik: " + err.message, "error");
                renderLoginPage();
            }
        }

        function renderSetupModal() {
            const html = `
                <div class="text-center mb-2">
                    <span style="font-size: 3rem;">🛠️</span>
                    <h2 class="handwritten" style="font-size: 2rem;">Tizimni dastlabki sozlash</h2>

                </div>

                    </div>
                    <div class="form-group">

                        <input type="password" id="setupPassConfirm" class="form-input" required minlength="4" placeholder="••••••••">
                    </div>
                    <button type="submit" id="setupBtn" class="btn btn-primary w-100 mt-2">
                        <span>Hisobni yaratish va kirish</span>
                    </button>
                </form>
            `;
            openModal("Birinchi O'qituvchi Hisobi", html);
        }

        async function handleSetupSubmit(e) {
            e.preventDefault();
            const login = document.getElementById('setupLogin').value.trim();
            const pass = document.getElementById('setupPass').value.trim();
            const passConfirm = document.getElementById('setupPassConfirm').value.trim();
            const btn = document.getElementById('setupBtn');

            if (pass !== passConfirm) {
                showToast("Kiritilgan parollar bir-biriga mos kelmadi!", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> <span>Yaratilmoqda...</span>`;

            try {
                const res = await api('/api/auth/setup', {
                    method: 'POST',
                    body: JSON.stringify({ login, password: pass })

                if (res.success && res.token) {
                    state.token = res.token;
                    state.user = res.user;
                    localStorage.setItem('daftar_token', res.token);

                    initDashboard();

            } catch (err) {
                showToast(err.message, "error");
                btn.disabled = false;
                btn.innerHTML = `<span>Hisobni yaratish va kirish</span>`;
            }
        }

        function renderLoginPage() {
            document.getElementById('userInfoHeader').style.display = 'none';

            let selectedRole = 'student';

            const container = document.getElementById('appMainContainer');

                <div class="login-layout">

                                    👨‍🎓 O'quvchi

                            <form id="loginForm" onsubmit="handleLoginSubmit(event)">

                            <div style="margin-top: 14px; padding: 7px 12px; background: #ecfdf5; border: 2px solid #10b981; border-radius: 8px; text-align: center; font-size: 0.78rem; color: #065f46; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px;">
                                <span>⚡ Supabase Auth bilan himoyalangan</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            window.currentLoginRole = 'student';
        }

        window.switchLoginRole = function(role) {
            window.currentLoginRole = role;
            document.getElementById('tabStudentBtn').classList.toggle('active', role === 'student');
            document.getElementById('tabTeacherBtn').classList.toggle('active', role === 'teacher');
            const loginInput = document.getElementById('loginInput');
            loginInput.placeholder = role === 'student' ? "Masalan: ali_valiyev" : "Masalan: ustoz1";
            loginInput.focus();
        };

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const role = window.currentLoginRole || 'student';
            const btn = document.getElementById('loginSubmitBtn');

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> <span>Tekshirilmoqda...</span>`;

            try {
                const res = await api('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        login,
                        password,
                        role,
                        supabase_key: SUPABASE_KEY
                    })
                });

                if (res.success && res.token) {
                    state.token = res.token;
                    state.user = res.user;
                    localStorage.setItem('daftar_token', res.token);
                    localStorage.setItem('daftar_user', JSON.stringify(res.user));
                    showToast("Xush kelibsiz, " + (res.user.name || res.user.login) + "!", "success");
                    initDashboard();
                }
            } catch (err) {
                showToast(err.message || "Login yoki parol noto'g'ri", "error");
                btn.disabled = false;
                btn.innerHTML = `<span>Tizimga kirish</span>`;
            }
        }

        function logout(prompt = true) {
            if (prompt && !confirm("Haqiqatan ham daftardan chiqmoqchimisiz?")) {
                return;
            }
            state.token = null;
            state.user = null;
            localStorage.removeItem('daftar_token');
            localStorage.removeItem('daftar_user');
            renderLoginPage();
            showToast("Tizimdan muvaffaqiyatli chiqildi", "info");
        }

        document.getElementById('logoutBtn').addEventListener('click', () => logout(true));

            state.theme = next;
            localStorage.setItem('daftar_theme', next);
            document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';

        // ──────────────────────── DASHBOARD CONTROLLER ────────────────────────
        function initDashboard() {

        window.handleScheduleBlur = async function(input) {
            const day = parseInt(input.dataset.day, 10);
            const slot = parseInt(input.dataset.slot, 10);
            const subject = input.value.trim();

            input.classList.add('saving');
            try {
                await api('/api/schedule', {
                    method: 'POST',
                    body: JSON.stringify({ day, slot, subject })
                });
                input.classList.remove('saving');
                input.classList.add('saved');
                setTimeout(() => input.classList.remove('saved'), 1200);
            } catch (err) {
                input.classList.remove('saving');
                showToast("Jadvalni saqlashda xato: " + err.message, "error");
            }
        };

        window.filterStudentsTable = function(query) {
            const q = (query || '').toLowerCase().trim();
            const classFilter = (document.getElementById('studentClassFilter')?.value || '').toLowerCase().trim();
            const rows = document.querySelectorAll('.student-row');
            rows.forEach(r => {
                const name = r.dataset.name || '';
                const login = r.dataset.login || '';
                const sClass = r.dataset.class || '';

                const matchesQuery = !q || name.includes(q) || login.includes(q);
                const matchesClass = !classFilter || sClass === classFilter || sClass.startsWith(classFilter);

                if (matchesQuery && matchesClass) {
                    r.style.display = '';
                } else {
                    r.style.display = 'none';
                }
            });
        };

        window.handleGradeStudentChange = function(studentId) {
            state.selectedStudentIdForGrade = studentId ? parseInt(studentId, 10) : null;
            renderGradesList();
        };

        window.renderGradesList = function() {
            const listArea = document.getElementById('gradesDisplayList');
            const avgBadgeContainer = document.getElementById('gradesAverageBadgeContainer');
            if (!listArea) return;

            let filtered = state.grades;
            if (state.selectedStudentIdForGrade) {
                filtered = state.grades.filter(g => g.student_id === state.selectedStudentIdForGrade);
            }

            if (filtered.length === 0) {
                listArea.innerHTML = `<div class="empty-state">Hali birorta baho qo'yilmagan.</div>`;
                if (avgBadgeContainer) avgBadgeContainer.innerHTML = '';
                return;
            }

            // Calculate overall average
            const sum = filtered.reduce((acc, g) => acc + g.grade, 0);
            const overallAvg = (sum / filtered.length).toFixed(2);
            if (avgBadgeContainer) {
                avgBadgeContainer.innerHTML = `
                    <span class="user-badge" style="background: var(--accent-yellow-light); font-size: 1rem;">
                        Umumiy o'rtacha: <strong>${overallAvg} ⭐</strong>
                    </span>
                `;
            }

            // Group by subject (or student then subject if all selected)
            if (state.selectedStudentIdForGrade) {
                // Group by subject only
                const subjects = {};
                filtered.forEach(g => {
                    if (!subjects[g.subject]) subjects[g.subject] = [];
                    subjects[g.subject].push(g);
                });

                let tableHtml = `
                    <div class="table-responsive">
                        <table class="notebook-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">Fan</th>
                                    <th>Qo'yilgan baholar</th>
                                    <th style="width: 100px; text-align: right;">O'rtacha</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${Object.keys(subjects).map(sub => {
                                    const items = subjects[sub];
                                    const subAvg = (items.reduce((a, b) => a + b.grade, 0) / items.length).toFixed(1);
                                    const col = getSubjectColor(sub);
                                    return `
                                        <tr>
                                            <td>
                                                <span class="subject-tag" style="background: ${col.bg}; color: ${col.text};">
                                                    ${escapeHtml(sub)}
                                                </span>
                                            </td>
                                            <td>
                                                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                                    ${items.map(g => `
                                                        <div class="grade-circle grade-${g.grade}" onclick="handleDeleteGrade(${g.id})" title="${formatDateUz(g.created_at?.split('T')[0])} — O'chirish uchun bosing">
                                                            ${g.grade}
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </td>
                                            <td style="text-align: right; font-weight: 900; font-size: 1.1rem; color: var(--primary);">
                                                ${subAvg}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                listArea.innerHTML = tableHtml;
            } else {
                // Group by student
                const studentGroups = {};
                filtered.forEach(g => {
                    const sId = g.student_id;
                    if (!studentGroups[sId]) {
                        studentGroups[sId] = {
                            name: g.student_name || 'O\'quvchi',
                            grades: []
                        };
                    }
                    studentGroups[sId].grades.push(g);
                });

                let html = '';
                Object.keys(studentGroups).forEach(sId => {
                    const group = studentGroups[sId];
                    const sAvg = (group.grades.reduce((a, b) => a + b.grade, 0) / group.grades.length).toFixed(2);
                    html += `
                        <div style="border: 2px solid var(--border-color); border-radius: var(--border-radius-sm); padding: 14px; margin-bottom: 12px; background: var(--input-bg);">
                            <div class="d-flex justify-between align-center mb-1">
                                <h4 style="font-size: 1.15rem; font-weight: 800;">👤 ${escapeHtml(group.name)}</h4>
                                <span class="subject-tag" style="background: var(--primary-light);">O'rtacha: ${sAvg}</span>
                            </div>
                            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                                ${group.grades.map(g => `
                                    <div style="display: inline-flex; align-items: center; gap: 4px; background: #fff; padding: 4px 8px; border-radius: 20px; border: 1.5px solid var(--border-color);">
                                        <span style="font-size: 0.8rem; font-weight: 700;">${escapeHtml(g.subject)}:</span>
                                        <div class="grade-circle grade-badge-sm grade-${g.grade}" onclick="handleDeleteGrade(${g.id})" title="O'chirish uchun bosing">
                                            ${g.grade}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                listArea.innerHTML = html;
            }
        };

        window.handleTeacherAddGrade = async function(gradeValue) {
            const studentSelect = document.getElementById('gradeStudentSelect');
            const subjectInput = document.getElementById('gradeSubjectInput');

            const student_id = parseInt(studentSelect.value, 10);
            const subject = subjectInput.value.trim();

            if (!student_id) {
                showToast("Iltimos, o'quvchini tanlang!", "warning");
                studentSelect.focus();
                return;
            }

            if (!subject) {
                showToast("Iltimos, fan nomini kiriting!", "warning");
                subjectInput.focus();
                return;
            }

            try {
                await api('/api/grades', {
                    method: 'POST',
                    body: JSON.stringify({
                        student_id,
                        subject,
                        grade: gradeValue
                    })
                });

                showToast(`"${subject}" fanidan ${gradeValue} baho qo'yildi!`, "success");

                // Refresh grades from backend
                const gradesRes = await api('/api/grades');
                state.grades = gradesRes.grades || [];
                renderGradesList();
            } catch (err) {
                showToast(err.message, "error");
            }
        };

        window.handleDeleteGrade = async function(gradeId) {
            if (!confirm("Haqiqatan ham ushbu bahoni o'chirmoqchimisiz?")) return;

            try {
                await api(`/api/grades/${gradeId}`, { method: 'DELETE' });
                showToast("Baho o'chirildi", "info");
                // Local filter & re-render
                state.grades = state.grades.filter(g => g.id !== gradeId);
                renderGradesList();
            } catch (err) {
                showToast(err.message, "error");
            }
        };

                                    } else if (diffDays <= 2) {
                                        deadlineClass = 'deadline-urgent';
                                        badgeHtml = `<span class="subject-tag" style="background: var(--accent-yellow); color: #1a1a1a;">⚠️ ${diffDays === 0 ? 'Bugun topshirish kerak' : diffDays === 1 ? 'Ertaga topshirish kerak' : '2 kun qoldi'}</span>`;
                                    }

                                    return `
                                        <div class="task-card ${isDone ? 'completed' : deadlineClass}">
                                            <div class="task-checkbox-wrap" onclick="toggleTaskCompleted(${task.id})">
                                                <div class="custom-checkbox">
                                                    ${isDone ? '✓' : ''}
                                                </div>
                                                <div>
                                                    <div class="task-text" style="font-weight: 800; font-size: 1.05rem;">
                                                        ${escapeHtml(task.text)}
                                                    </div>
                                                    <div style="font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 10px; align-items: center; margin-top: 4px;">
                                                        <span>📅 Muddat: <strong>${formatDateUz(task.deadline)}</strong></span>
                                                        ${badgeHtml}
                                                    </div>
                                                </div>
                                            </div>

                                            <div style="display: flex; align-items: center; gap: 8px;">
                                                <input type="file" id="fileInput_${task.id}" accept="image/*" style="display: none;" onchange="handleStudentUploadImage(event, ${task.id})">
                                                <button class="btn btn-sm btn-yellow" onclick="document.getElementById('fileInput_${task.id}').click()" title="Daftar rasmini yuklash">
                                                    <span>📸 Rasm yuklash</span>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>

                    <!-- My Uploaded Images -->
                    <div class="notebook-card">
                        <h2 style="font-size: 1.8rem; margin-bottom: 6px;">🖼 Mening yuklagan rasmlarim (${state.images.length})</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">
                            Siz tomonidan yuborilgan uy vazifasi rasmlari. O'qituvchi bularni ko'rib baholashi mumkin.
                        </p>

                        ${state.images.length === 0 ? `
                            <div class="empty-state">Hali rasm yuklamagansiz. Yuqoridagi vazifa kartalaridagi "Rasm yuklash" tugmasini bosing.</div>
                        ` : `
                            <div class="image-gallery-grid">
                                ${state.images.map(img => `
                                    <div class="image-card" onclick="openLightbox('${img.image_url}', 'Mening vazifam', 'Yuklangan vaqt: ${img.created_at}')">
                                        <img src="${img.image_url}" alt="Vazifa rasmi" class="image-card-thumb" loading="lazy">
                                        <div class="image-card-body">
                                            <div class="image-card-date">🕒 ${img.created_at?.slice(0, 16) || ''}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                `;

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="empty-state">Xatolik: ${err.message}</div>`;
            }
        }

        window.toggleTaskCompleted = function(taskId) {
            const key = `student_completed_tasks_${state.user.id}`;
            const completedMap = JSON.parse(localStorage.getItem(key) || '{}');
            completedMap[taskId] = !completedMap[taskId];
            localStorage.setItem(key, JSON.stringify(completedMap));
            renderStudentTasksTab(document.getElementById('tabContentArea'));
        };

        window.handleStudentUploadImage = async function(event, taskId) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);
            if (taskId) {
                formData.append('task_id', taskId);
            }

            showToast("Rasm yuklanmoqda...", "info");

            try {
                const res = await api('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (res.success) {
                    showToast("Rasm muvaffaqiyatli yuklandi! 📸", "success");
                    renderStudentTasksTab(document.getElementById('tabContentArea'));
                }
            } catch (err) {
                showToast("Rasmni yuklashda xatolik: " + err.message, "error");
            }
        };

        // 3. Student Grades Tab
        async function renderStudentGradesTab(container) {
            container.innerHTML = `<div class="empty-state"><span class="spinner spinner-dark"></span> Baholar yuklanmoqda...</div>`;

            try {
                const res = await api('/api/grades');
                state.grades = res.grades || [];

                // Calculate overall stats
                const totalGrades = state.grades.length;
                let overallAvg = 0;
                let sumGrades = 0;
                if (totalGrades > 0) {
                    sumGrades = state.grades.reduce((a, b) => a + b.grade, 0);
                    overallAvg = sumGrades / totalGrades;
                }

                // Group by subject
                const subjects = {};
                state.grades.forEach(g => {
                    if (!subjects[g.subject]) subjects[g.subject] = [];
                    subjects[g.subject].push(g);
                });

                let html = `
                    <!-- Overall Stats Banner -->
                    <div class="notebook-card mb-3" style="background: var(--primary-light);">
                        <div class="d-flex justify-between align-center" style="flex-wrap: wrap; gap: 16px;">
                            <div>
                                <span class="subject-tag mb-1" style="background: #fff;">📊 O'zlashtirish</span>
                                <h2 style="font-size: 2.2rem; margin: 4px 0;">Umumiy o'rtacha ball: ${totalGrades > 0 ? overallAvg.toFixed(2) : '—'} ⭐</h2>
                                <p style="font-weight: 700; color: var(--text-muted);">
                                    Jami qo'yilgan baholar soni: <strong>${totalGrades} ta</strong>
                                </p>
                            </div>
                            <div style="font-size: 4rem;">🎓</div>
                        </div>
                    </div>

                    <!-- Goal Calculator Card -->
                    <div class="notebook-card mb-3">
                        <h2 style="font-size: 1.8rem; margin-bottom: 6px;">🎯 Maqsad kalkulyatori</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 14px;">
                            Erishmoqchi bo'lgan o'rtacha ballingizni tanlang. Tizim sizga ketma-ket nechta "5" baho olishingiz kerakligini hisoblab beradi:
                        </p>

                        <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
                            <label class="form-label" style="margin: 0; font-size: 1rem;">O'rtacha ball maqsadi:</label>
                            <select id="goalSelector" class="form-select" style="max-width: 180px;" onchange="calculateGoalAdvice(this.value, ${sumGrades}, ${totalGrades})">
                                <option value="">— Tanlang —</option>
                                <option value="3.5">3.5 ball</option>
                                <option value="4.0">4.0 ball</option>
                                <option value="4.5">4.5 ball</option>
                                <option value="5.0">5.0 ball</option>
                            </select>
                        </div>

                        <div id="goalAdviceResult" class="mt-2"></div>
                    </div>

                    <!-- Grades by Subject -->
                    <div class="notebook-card">
                        <h2 style="font-size: 1.8rem; margin-bottom: 12px;">📘 Fanlar bo'yicha baholarim</h2>

                        ${totalGrades === 0 ? `
                            <div class="empty-state">Hozircha birorta ham baho qo'yilmagan. Darslarda faol qatnashing! 📚</div>
                        ` : `
                            <div class="table-responsive">
                                <table class="notebook-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 25%;">Fan</th>
                                            <th>Baholar</th>
                                            <th style="width: 120px; text-align: right;">O'rtacha</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${Object.keys(subjects).map(sub => {
                                            const items = subjects[sub];
                                            const subSum = items.reduce((a, b) => a + b.grade, 0);
                                            const subAvg = (subSum / items.length).toFixed(1);
                                            const col = getSubjectColor(sub);
                                            return `
                                                <tr>
                                                    <td>
                                                        <span class="subject-tag" style="background: ${col.bg}; color: ${col.text}; font-size: 0.95rem;">
                                                            ${escapeHtml(sub)}
                                                        </span>
                                                    </td>
                                                    <td>
                                                        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                                            ${items.map(g => `
                                                                <div class="grade-circle grade-${g.grade}" title="${formatDateUz(g.created_at?.split('T')[0])}">
                                                                    ${g.grade}
                                                                </div>
                                                            `).join('')}
                                                        </div>
                                                    </td>
                                                    <td style="text-align: right; font-weight: 900; font-size: 1.2rem; color: var(--primary);">
                                                        ${subAvg}
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                `;

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="empty-state">Xatolik: ${err.message}</div>`;
            }
        }

        window.calculateGoalAdvice = function(goalStr, currentSum, count) {
            const resultDiv = document.getElementById('goalAdviceResult');
            if (!resultDiv) return;

            if (!goalStr) {
                resultDiv.innerHTML = '';
                return;
            }

            const goal = parseFloat(goalStr);
            if (count === 0) {
                resultDiv.innerHTML = `
                    <div style="padding: 12px 16px; border: 2px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--accent-yellow-light); font-weight: 700;">
                        💡 Hali baholaringiz yo'q. Birinchi oladigan 5 bahoyingiz orqali maqsadingizga erishishingiz mumkin!
                    </div>
                `;
                return;
            }

            const currentAvg = currentSum / count;
            if (currentAvg >= goal) {
                resultDiv.innerHTML = `
                    <div style="padding: 14px 18px; border: 2px solid var(--accent-green); border-radius: var(--border-radius-sm); background: var(--accent-green-light); font-weight: 800; color: #064e3b;">
                        🎉 Ajoyib! Sizning hozirgi o'rtacha ballingiz (${currentAvg.toFixed(2)}) allaqachon maqsadingizdan (${goal}) yuqori yoki teng!
                    </div>
                `;
                return;
            }

            // Math: (currentSum + 5 * k) / (count + k) >= goal
            // currentSum + 5k >= goal * count + goal * k
            // k * (5 - goal) >= goal * count - currentSum
            // k = ceil((goal * count - currentSum) / (5 - goal))
            if (goal >= 5.0) {
                resultDiv.innerHTML = `
                    <div style="padding: 14px 18px; border: 2px solid var(--accent-yellow); border-radius: var(--border-radius-sm); background: var(--accent-yellow-light); font-weight: 700;">
                        💡 O'rtacha 5.0 bo'lishi uchun hech qanday 4, 3 yoki 2 baho bo'lmasligi kerak. Biroq iloji boricha ko'p 5 olib 4.9+ ga yaqinlashishingiz mumkin!
                    </div>
                `;
                return;
            }

            const numerator = (goal * count) - currentSum;
            const denominator = 5.0 - goal;
            const required5s = Math.ceil(numerator / denominator);

            resultDiv.innerHTML = `
                <div style="padding: 14px 18px; border: 2px solid var(--primary); border-radius: var(--border-radius-sm); background: var(--primary-light); font-weight: 800; font-size: 1.05rem;">
                    🎯 Maqsadga (${goal}) yetish uchun ketma-ket <span style="font-size: 1.3rem; color: var(--primary);">${required5s} ta</span> 5 kerak!
                </div>
            `;
        };

        // ══════════════════════════════════════════════════════════════
        //               4. LEADERBOARD (REYTING) TAB
        // ══════════════════════════════════════════════════════════════

        async function renderLeaderboardTab(container, selectedClass = '') {
            container.innerHTML = `<div class="empty-state"><span class="spinner spinner-dark"></span> Reyting yuklanmoqda...</div>`;

            try {
                const url = selectedClass ? `/api/leaderboard?class_name=${encodeURIComponent(selectedClass)}` : '/api/leaderboard';
                const [lbRes, clRes] = await Promise.all([
                    api(url),
                    api('/api/classes')
                ]);

                const board = lbRes.leaderboard || [];
                const classes = clRes.classes || [];

                let myStudentRank = null;
                if (state.user.role === 'student') {
                    board.forEach(item => {
                        if (item.student_id === state.user.id || item.student_login === state.user.login) {
                            myStudentRank = item;
                        }
                    });
                }

                const html = `
                    <div class="notebook-card mb-2">
                        <div class="d-flex justify-between align-center" style="flex-wrap: wrap; gap: 14px;">
                            <div>
                                <h2 style="font-size: 2rem; margin: 0;">🏆 O'quvchilar Reytingi</h2>
                                <p style="color: var(--text-muted); font-size: 0.95rem;">
                                    Maktab va 1-11 sinflar bo'yicha baholar o'rtachasi va a'lo baholar asosidagi reyting.
                                </p>
                            </div>
                            <div class="d-flex align-center" style="gap: 10px;">
                                <label style="font-weight: 800; font-size: 0.95rem;">🏫 Sinf:</label>
                                <select class="form-input" style="width: auto; padding: 6px 12px; font-weight: 800;" onchange="renderLeaderboardTab(document.getElementById('tabContentArea'), this.value)">
                                    <option value="" ${!selectedClass ? 'selected' : ''}>🌐 Barcha sinflar (Maktab)</option>
                                    ${classes.map(c => `<option value="${c.class_name}" ${selectedClass === c.class_name ? 'selected' : ''}>${c.class_name} (${c.count} o'quvchi)</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        ${myStudentRank ? `
                            <div class="notebook-card mt-2" style="background: var(--accent-green-light); border: 2px solid var(--accent-green);">
                                <div class="d-flex justify-between align-center" style="flex-wrap: wrap; gap: 10px;">
                                    <div>
                                        <span style="font-size: 1.5rem;">${myStudentRank.medal || '🎖'}</span>
                                        <strong style="font-size: 1.1rem; margin-left: 6px;">Sizning o'rningiz:</strong>
                                        <span style="font-weight: 800;">${myStudentRank.rank}-o'rin</span> [${myStudentRank.class_name}]
                                    </div>
                                    <div style="font-size: 1rem; font-weight: 800;">
                                        ⭐️ O'rtacha ball: <span style="font-size: 1.2rem; color: var(--accent-green);">${Number(myStudentRank.avg_grade).toFixed(2)}</span>
                                        <span style="color: var(--text-muted); font-size: 0.9rem; margin-left: 8px;">(${myStudentRank.grades_count} ta baho)</span>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="notebook-card">
                        <div class="table-responsive">
                            <table class="notebook-table">
                                <thead>
                                    <tr>
                                        <th style="width: 70px; text-align: center;">O'rin</th>
                                        <th>O'quvchi</th>
                                        <th>Sinf</th>
                                        <th style="text-align: center;">Baholar soni</th>
                                        <th style="text-align: center;">5️⃣ A'lo</th>
                                        <th style="text-align: center;">4️⃣ Yaxshi</th>
                                        <th style="text-align: right;">O'rtacha ball</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${board.length === 0 ? `
                                        <tr><td colspan="7" class="empty-state">Hozircha baholangan o'quvchilar yo'q.</td></tr>
                                    ` : board.map(item => {
                                        const isMe = (state.user.role === 'student' && (item.student_id === state.user.id || item.student_login === state.user.login));
                                        const rowStyle = isMe ? 'background: var(--accent-green-light); font-weight: 800;' : '';
                                        return `
                                            <tr style="${rowStyle}">
                                                <td style="text-align: center; font-size: 1.2rem; font-weight: 900;">
                                                    ${item.medal || item.rank}
                                                </td>
                                                <td>
                                                    <strong>${escapeHtml(item.student_name)}</strong>
                                                    ${isMe ? '<span class="subject-tag" style="margin-left: 6px; background: var(--accent-green); color: white;">Siz</span>' : ''}
                                                </td>
                                                <td>
                                                    <span class="subject-tag" style="background: var(--primary-light); color: var(--primary); font-weight: 800;">
                                                        🏫 ${escapeHtml(item.class_name)}
                                                    </span>
                                                </td>
                                                <td style="text-align: center; font-weight: 700;">${item.grades_count} ta</td>
                                                <td style="text-align: center; color: var(--accent-green); font-weight: 800;">${item.fives_count}</td>
                                                <td style="text-align: center; color: var(--primary); font-weight: 800;">${item.fours_count}</td>
                                                <td style="text-align: right; font-weight: 900; font-size: 1.15rem; color: var(--accent-yellow);">
                                                    ⭐️ ${Number(item.avg_grade).toFixed(2)}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="empty-state">Reytingni yuklashda xatolik: ${err.message}</div>`;
            }
        }

        // ──────────────────────── STARTUP INITIALIZATION ────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            checkAppInit();
        });
    </script>
</body>
</html>
